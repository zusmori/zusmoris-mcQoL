# Starts Minecraft once without a screen and checks that the mod loads without errors.
name: smoketest
on:
  workflow_run:
    workflows: [build]
    types: [completed]
permissions:
  contents: write
jobs:
  run:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install xvfb and mesa
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri
      - name: run client for a while
        shell: bash
        run: |
          chmod +x ./gradlew
          mkdir -p run
          set +e
          export JAVA_TOOL_OPTIONS="-Dmcqol.audit=true" LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" ./gradlew runClient --no-configuration-cache > gradle-run.txt 2>&1
          echo "exit: $?" >> gradle-run.txt
          true
      - name: push logs
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp gradle-run.txt /tmp/out/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/out/ 2>/dev/null || true
          cp -r run/crash-reports /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b smoketest
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Smoketest ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" smoketest
