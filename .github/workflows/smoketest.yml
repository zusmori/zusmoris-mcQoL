# Starts Minecraft in a test world, takes screenshots and checks that the mod loads without errors.
name: smoketest
on:
  workflow_run:
    workflows: [build]
    types: [completed]
permissions:
  contents: write
jobs:
  run:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-vulkan-drivers
      - name: run client game test
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          JAVA_TOOL_OPTIONS="-Dmcqol.audit=true" timeout 900 ./gradlew runClientGameTest --stacktrace > gradle-run.txt 2>&1
          echo "exit: $?" >> gradle-run.txt
          true
      - name: push logs and screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp gradle-run.txt /tmp/out/ 2>/dev/null || true
          find . -path ./.git -prune -o \( -name latest.log -o -name "*.png" -path "*screenshots*" \) -print 2>/dev/null | grep -v "^./src" | while read f; do cp "$f" /tmp/out/ 2>/dev/null || true; done
          find . -type d -name crash-reports -not -path "./.git/*" -exec cp -r {} /tmp/out/ \; 2>/dev/null || true
          cd /tmp/out
          git init -q -b smoketest
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Smoketest ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" smoketest
