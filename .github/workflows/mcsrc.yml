name: mcsrc
on:
  push:
    paths: ['.github/workflows/mcsrc.yml']
permissions:
  contents: write
jobs:
  src:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew genSources --no-configuration-cache
      - name: extract classes
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/src && cd /tmp/src
          find ~/.gradle "$GITHUB_WORKSPACE/.gradle" "$GITHUB_WORKSPACE/build" -name "*.jar" 2>/dev/null | grep -i "sources" > jars.txt
          cat jars.txt
          while read j; do unzip -qo "$j" 'net/minecraft/*' -x 'net/minecraft/data/*' 'net/minecraft/gametest/*' 2>/dev/null; done < jars.txt
          find . -name "*.java" | wc -l
          git init -q -b mcsrc
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "mc sources"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mcsrc
